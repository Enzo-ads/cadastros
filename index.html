<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Cadastro de Profissões</title>
</head>
<body>
    <div class="container">
        <h1>Cadastro de Profissionais</h1>

        <form id="formProfissional">
            <input type="text" id="nome" placeholder="Nome do profissional" required>
            
            <select id="profissao" required>
                <option value="" disabled selected>Selecione uma profissão</option>
                <option value="Desenvolvedor(a) de Software">Desenvolvedor(a) de Software</option>
                <option value="Engenheiro(a) Civil">Engenheiro(a) Civil</option>
                <option value="Médico(a)">Médico(a)</option>
                <option value="Designer UI/UX">Designer UI/UX</option>
                <option value="Advogado(a)">Advogado(a)</option>
                <option value="Arquiteto(a)">Arquiteto(a)</option>
                <option value="Enfermeiro(a)">Enfermeiro(a)</option>
                <option value="Professor(a)">Professor(a)</option>
                <option value="Psicólogo(a)">Psicólogo(a)</option>
                <option value="Contador(a)">Contador(a)</option>
            </select>

            <button id="btnSalvar" type="submit">Cadastrar</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Nome</th>
                    <th>Profissão</th>
                </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>

    <script src="main.js"></script>
</body>
</html>
